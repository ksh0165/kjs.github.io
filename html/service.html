<!DOCTYPE html>
<html lang="kr">
<head>
<meta http-equiv="content-type" content="text/html; charset=utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title></title>
<link rel="stylesheet" href="../css/style.css" type="text/css">
<script type="text/javascript" src="../js/common.js"></script>
</head>
<body>
<div id="wrap">

    <div class="header">
        <div class="header-title">코난 챗봇 플러스 통번역 서비스</div>
        <p class="header-copy">Translation Support Service</p>
    </div>

    <div class="contents">

        <div class="service" style="margin-top:-10%;"> <!-- margin값으로 위치 조정하세요. -->
            <div class="cont-title">
                <div class="cont-title-main">"서비스 이용 방식을 선택하세요"</div>
                <p class="cont-title-eng">"Choose how to use service"</p>
            </div>

            <div class="service-choice">
                <div class="servie-choice--round">
                You can use <span class="service-choice--tablet">this tablet</span> or <span class="service-choice--phone">use your phone</span>
                </div>
            </div>

            <div class="service-device">
                <div class="service-device-tablet">
                    <a href="#">
                        <div class="service-device__img"><img src="../img/choice_tablet.png" alt=""></div>
                        <div class="service-device__text">
                            Using the provided<br>
                            tablet and microphone
                        </div>
                    </a>
                </div>
                <div class="service-device-phone">
                    <a href="#">
                    <div class="service-device__img"><img src="../img/choice_phone.png" alt=""></div>
                    <div class="service-device__text">
                        Scan the QR code to use<br>
                        the service on your phone
                    </div>
                    </a>
                </div>
            </div>
        </div>

    </div>

    <div class="bottom">
        <div class="konan-chatbot"><img src="../img/index_copy.png" alt=""></div>
        <div class="copy-konan"><img src="../img/logo_konan.png" alt=""></div>
    </div>
</div>
</body>
</html>
